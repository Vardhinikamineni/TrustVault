
<!DOCTYPE html>
<html>
<head>
    <title>Edit Document - TrustVault</title>
</head>
<body>

    <h1>TrustVault</h1>
    <h2>Edit Document</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Document Title:</label><br>
        <input type="text" name="title"
               value="{{ document.title }}" required>

        <br><br>

        <label>Document Category:</label><br>
        <select name="category" required>
            <option value="general" {% if document.category == "general" %}selected{% endif %}>General</option>
            <option value="education" {% if document.category == "education" %}selected{% endif %}>Education</option>
            <option value="finance" {% if document.category == "finance" %}selected{% endif %}>Finance</option>
            <option value="legal" {% if document.category == "legal" %}selected{% endif %}>Legal</option>
            <option value="personal" {% if document.category == "personal" %}selected{% endif %}>Personal</option>
            <option value="business" {% if document.category == "business" %}selected{% endif %}>Business</option>
        </select>

        <br><br>

        <label>Replace File (optional):</label><br>
        <input type="file" name="file">

        <br><br>

        <button type="submit">Update Document</button>
    </form>

    <br>
    <a href="{% url 'my_documents' %}">Back to My Documents</a>

</body>
</html>
