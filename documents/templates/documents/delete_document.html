
<!DOCTYPE html>
<html>
<head>
    <title>Delete Document - TrustVault</title>
</head>
<body>

    <h1>TrustVault</h1>
    <h2>Delete Document</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ document.title }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <br>
    <a href="{% url 'my_documents' %}">Cancel</a>

</body>
</html>
